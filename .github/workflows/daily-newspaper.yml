name: Daily Kindle Newspaper

on:
  schedule:
    # Off-peak minutes avoid GitHub Actions' :00/:30 cron congestion.
    # Primary: 5:17 AM PST / 6:17 AM PDT; Backup: 5:47 AM PST / 6:47 AM PDT (skips if already built today).
    - cron: "17 13 * * *"
    - cron: "47 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Restore rolling 14-day archive from gh-pages (if present)
        id: archive
        run: |
          mkdir -p dist/issues
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git archive origin/gh-pages issues 2>/dev/null | tar -x -C dist || true
          fi
          TODAY_PT=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "dist/issues/${TODAY_PT}-The-David-Times.pdf" ]; then
            echo "Today's issue (${TODAY_PT}) is already published — skipping duplicate backup cron."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate The David Times PDF & OPDS catalog
        if: steps.archive.outputs.skip != 'true'
        run: |
          BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          python -m src.main \
            --config config.yaml \
            --output output/latest.pdf \
            --publish-dir dist \
            --base-url "$BASE_URL"

      - name: Upload PDF as workflow artifact
        if: steps.archive.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: the-david-times-latest
          path: output/latest.pdf
          retention-days: 7

      - name: Deploy to GitHub Pages (gh-pages branch)
        if: steps.archive.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "Publish daily edition of The David Times"
