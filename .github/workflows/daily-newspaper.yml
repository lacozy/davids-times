name: Daily Kindle Newspaper

on:
  schedule:
    # Runs daily at 5:30 AM PST / 6:30 AM PDT (13:30 UTC)
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Restore rolling 14-day archive from gh-pages (if present)
        run: |
          mkdir -p dist/issues
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git archive origin/gh-pages issues 2>/dev/null | tar -x -C dist || true
          fi

      - name: Generate The David Times PDF & OPDS catalog
        run: |
          BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          python -m src.main \
            --config config.yaml \
            --output output/latest.pdf \
            --publish-dir dist \
            --base-url "$BASE_URL"

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-david-times-latest
          path: output/latest.pdf
          retention-days: 7

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "Publish daily edition of The David Times"
